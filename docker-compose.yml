version: '3.8'

services:
  # MongoDB
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - smart-leads-net

  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-leads-server
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/smart-leads
      - JWT_SECRET=sld_docker_jwt_secret_2024
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo
    networks:
      - smart-leads-net

  # Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-leads-client
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - smart-leads-net

volumes:
  mongo-data:

networks:
  smart-leads-net:
    driver: bridge
